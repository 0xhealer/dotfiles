[shell.panel]
transparency_mode = "glass"

[bar.default]
background_opacity = 0.85

[wallpaper]
directory = "~/Pictures/Wallpapers"

[widget.clock]
format = "{:%H:%M %a, %b %d}"

[theme]
mode = "dark"
source = "custom"
custom_palette = "RosePine"

# Only sway is themed by Noctalia here; every other app uses the static Rose Pine files from install step 82.
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["sway"]
enable_community_templates = false

[hooks]
wallpaper_changed = "sh -c 'exec \"$HOME/.local/bin/wallpaper-set\" \"$NOCTALIA_WALLPAPER_PATH\"'"
