[shell]
font_family = "JetBrainsMono NF"
app_icon_colorize = false
settings_window_translucent = true
shared_gl_context = true
time_format = "{:%H:%M}"
screen_time_enabled = true
telemetry_enabled = false

    [shell.panel]
    transparency_mode = "glass"
    borders = true
    shadow = true
    control_center_placement = "attached"
    launcher_placement = "floating"
    launcher_position = "center"
    clipboard_placement = "floating"
    clipboard_position = "center"
    session_placement = "attached"
    wallpaper_placement = "attached"
    wallpaper_position = "center"

    [shell.window_switcher]
    style = "carousel"
    show_all_outputs = true

[bar]
order = [ "default" ]

    [bar.default]
    enabled = true
    position = "top"
    thickness = 34
    radius = 12
    background_opacity = 0.17
    compositor_blur = true
    concave_edge_corners = true
    reserve_space = true
    font_family = "JetBrainsMono NF"
    start = [ "launcher", "wallpaper", "workspaces", "tray", "bar" ]
    center = [ "clock" ]
    end = [
        "media",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "control-center",
        "session"
    ]

[dock]
enabled = true
monitors = [ "HDMI-A-1" ]
position = "bottom"
background_opacity = 0.34
icon_size = 27
magnification = true
magnification_scale = 1.4500000476837158
show_running = true
show_dots = true

[notification]
background_opacity = 0.85
position = "top_right"

[osd]
background_opacity = 0.85
position = "top_center"

[lockscreen]
enabled = true
fingerprint = true
lock_before_suspend = true

[wallpaper]
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"
transition_on_startup = false

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[weather]
enabled = true
unit = "metric"

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000003", "desktop-widget-0000000000000004" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 48.0
    box_width = 176.0
    cx = 203.29412841796875
    cy = 123.75
    enabled = true
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 48.0
    box_width = 576.0
    cx = 1456.941162109375
    cy = 1046.25
    enabled = true
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = -0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        background = false
        bands = 32
        show_when_idle = true

    [desktop_widgets.widget.desktop-widget-0000000000000004]
    box_height = 48.0
    box_width = 576.0
    cx = 417.88235473632812
    cy = 1046.25
    enabled = true
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = -0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000004.settings]
        background = false
        bands = 32
        show_when_idle = true

[plugin_settings."kenn/keybind-cheatsheet"]
compositor = "niri"

[plugins]
auto_update = "all"
enabled = [ "yngwe/wallpaperCarousel", "kenn/keybind-cheatsheet", "raycursive/niri-displays" ]

    [[plugins.source]]
    enabled = true
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    enabled = true
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[widget.bar]
type = "raycursive/niri-displays:bar"

[widget.clock]
format = "{:%H:%M %a, %b %d}"
type = "clock"

[widget.media]
art_size = 16.0
hide_artist = true
hide_when_no_media = true
max_length = 220.0
min_length = 80.0
title_scroll = "on_hover"
type = "media"

# Colours come from the wallpaper and are rendered into every app below
[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"
pure_black_dark = true

    [theme.templates]
    enable_builtin_templates = true
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "ghostty", "kcolorscheme", "kitty", "niri", "qt", "starship" ]
    enable_community_templates = true
    community_ids = [
        "brave",
        "discord",
        "telegram",
        "obsidian",
        "vscode",
        "steam",
        "vicinae",
        "zathura",
        "lazygit",
        "tmux",
        "yazi"
    ]

    [theme.templates.user.spicetify_text]
    input_path = "$XDG_CONFIG_HOME/noctalia/templates/spicetify-text.ini"
    output_path = "$XDG_CONFIG_HOME/spicetify/Themes/text/color.ini"
    post_hook = "sh -c 'PATH=\"$HOME/.local/bin:$HOME/.spicetify:$PATH\" spicetify -q apply --no-restart >/dev/null 2>&1 || true'"
