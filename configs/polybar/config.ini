include-file = ~/.config/matugen/generated/polybar-colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 30pt
radius = 8
fixed-center = true
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000
padding-left = 1
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = Symbols Nerd Font Mono:size=13;3
font-1 = JetBrainsMono Nerd Font:size=11;3

modules-left = wallpaper i3 xwindow
modules-center = date
modules-right = ${env:POLYBAR_RIGHT:vpn brightness dunst pulseaudio cpu memory filesystem wlan eth battery powermenu}

cursor-click = pointer
enable-ipc = true
wm-restack = i3
override-redirect = false

[bar/secondary]
inherit = bar/main
modules-right = ${env:POLYBAR_RIGHT_SECONDARY:vpn brightness dunst pulseaudio cpu memory filesystem wlan eth battery powermenu}

[module/wallpaper]
type = custom/text
content = 
content-foreground = ${colors.primary}
click-left = $HOME/.local/bin/wallpaper-select
click-right = $HOME/.local/bin/wallpaper-set

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false

label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-padding = 1

label-visible = %index%
label-visible-padding = 1

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%

[module/date]
type = internal/date
interval = 1
date = %a %d %b   %H:%M
date-alt =  %Y-%m-%d   %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[module/vpn]
type = custom/script
exec = $HOME/.local/bin/polybar-vpn
interval = 5
format-foreground = ${colors.secondary}

[module/brightness]
type = custom/script
exec = $HOME/.local/bin/brightness-status
interval = 2
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

[module/dunst]
type = custom/script
exec = if [ "$(dunstctl is-paused 2>/dev/null)" = true ]; then echo ""; else echo ""; fi
interval = 2
click-left = dunstctl set-paused toggle
click-right = dunstctl history-pop
format-foreground = ${colors.primary}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
format-muted = <label-muted>
label-muted =  muted
label-muted-foreground = ${colors.disabled}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.primary}
click-right = pavucontrol

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %percentage_used%%
label-unmounted = n/a

[network-base]
type = internal/network
interval = 3
format-disconnected = <label-disconnected>
label-disconnected = %{F${colors.disabled}} offline%{F-}

[module/wlan]
inherit = network-base
interface-type = wireless
format-connected = <ramp-signal> <label-connected>
label-connected = %essid% %signal%% %downspeed% %upspeed% %local_ip%
ramp-signal-0 = 
ramp-signal-1 = 
ramp-signal-2 = 
ramp-signal-foreground = ${colors.primary}
click-left = nm-connection-editor
click-right = kitty -e nmtui

[module/eth]
inherit = network-base
interface-type = wired
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %ifname% %local_ip% %downspeed% %upspeed%
label-disconnected =
click-left = nm-connection-editor
click-right = kitty -e nmtui

[module/battery]
type = internal/battery
battery = ${env:POLYBAR_BATTERY:BAT0}
adapter = ${env:POLYBAR_ADAPTER:AC}
full-at = 99
low-at = 15
poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <ramp-capacity> <label-low>
label-charging = %percentage%% (%time%)
label-discharging = %percentage%% (%time%)
label-full = %percentage%%
label-low = %percentage%% (%time%)
label-low-foreground = ${colors.alert}
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.primary}
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-foreground = ${colors.secondary}
animation-charging-framerate = 750

[module/powermenu]
type = custom/text
content = 
content-foreground = ${colors.alert}
click-left = $HOME/.local/bin/powermenu

[settings]
screenchange-reload = true
pseudo-transparency = false
