<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/**/NotoColorEmoji.ttf</glob>
      <glob>/usr/share/fonts/**/*emoji*</glob>
      <glob>/usr/share/fonts/**/*Emoji*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
