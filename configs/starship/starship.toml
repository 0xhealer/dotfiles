palette = "catppuccin_mocha"

# Line 1: time, user, host, dir, git branch, then EVERY language/toolchain
# module Starship ships - each printing its official Nerd Font logo + full name + version.
# Line 2: exit-status check/cross, then 癒 in place of the prompt char.
format = """$time$username$hostname$directory$git_branch(using $nix_shell$c$cpp$golang$python$rust$nodejs${custom.lua_windows}${custom.lua_unix}$java$kotlin$scala$swift$php$ruby$perl$haskell$julia$zig$gradle$cobol$crystal$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$mojo$nim$ocaml$odin$opa$purescript$raku$red$rlang$solidity$typst$vlang${custom.shell_sh_windows}${custom.shell_sh_unix}${custom.shell_ps1})$line_break$character"""

[palettes.catppuccin_mocha]
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
surface0 = "#313244"
surface1 = "#45475a"
surface2 = "#585b70"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
overlay2 = "#9399b2"
subtext0 = "#a6adc8"
subtext1 = "#bac2de"
text = "#cdd6f4"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
mauve = "#cba6f7"
lavender = "#b4befe"
pink = "#f5c2e7"
flamingo = "#f2cdcd"
rosewater = "#f5e0dc"

[time]
disabled = false
format = "[$time](bold subtext0) "
time_format = "%R"

[username]
show_always = true
format = "[$user](bold green) at "
style_root = "bold red"

[hostname]
disabled = false
format = "[$hostname](bold yellow) in "
ssh_only = false

[directory]
style = "bold sky"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
format = '[\($branch\)]($style) '
style = "bold red"

[character]
success_symbol = '[](bold green) [癒](bold sapphire)'
error_symbol = '[](bold red) [癒](bold sapphire)'

