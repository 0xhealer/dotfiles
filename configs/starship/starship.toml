[custom.shell_sh_windows]
detect_extensions = ["sh"]
os = "windows"
symbol = " "
format = "[$symbol Bash ]($style)"
style = "bold green"

[custom.shell_sh_unix]
detect_extensions = ["sh"]
os = "unix"
command = "bash --version | head -n1 | grep -oE '[0-9]+\\.[0-9]+\\.[0-9]+' | head -n1"
shell = ["bash", "--norc"]
symbol = " "
format = "([$symbol Bash $output ]($style))"
style = "bold green"

# Actually verified against a real pwsh binary this time (installed one
# and traced it), not just a Linux fallback path. Two real bugs, now both
# fixed:
# 1. `command` was a second full "pwsh -NoProfile -Command ..." wrapped
#    inside the shell that's already pwsh - redundant nesting.
# 2. The real killer: when `shell` has explicit args, Starship does NOT
#    append the "-" pwsh needs after -Command to tell it "read the
#    command from stdin". Without it, pwsh hard-errors immediately with
#    "A command must follow -Command" before ever seeing our command -
#    confirmed via STARSHIP_LOG=trace, this is what "no logo" actually
#    was. Fix: put "-" in `shell` explicitly, matching the pattern
#    Starship's own test suite uses for this exact case.
[custom.shell_ps1]
detect_extensions = ["ps1"]
command = "$PSVersionTable.PSVersion.ToString()"
shell = ["pwsh", "-NoProfile", "-Command", "-"]
ignore_timeout = true
symbol = "󰨊 "
format = "([$symbol PowerShell $output ]($style))"
style = "bold blue"
