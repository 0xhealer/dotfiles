# tmux: practical defaults, prefix Ctrl+a and a project sessionizer. Rose Pine Moon colours.

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-interval 5
set -g status-position bottom
set -g monitor-activity off

set -g status-left-length 30
set -g status-left " #S  "
set -g status-right " #{=21:pane_title} | %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# prefix Ctrl+a (press it twice to send it to the program inside)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# splits keep the current directory, | and - are easier to remember than " and %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane movement and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy mode like vim, copy to the system clipboard where one exists
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind -r ^ last-window

# jump to a project: prefix f (or prefix Ctrl+f)
bind -r f run-shell "tmux neww tmux-sessionizer"
bind -r C-f run-shell "tmux neww tmux-sessionizer"

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Rose Pine Moon
set -g status-style "bg=#232136,fg=#E0DEF4"
set -g status-left-style "bg=#C4A7E7,fg=#232136,bold"
set -g status-right-style "bg=#2A273F,fg=#908CAA"
set -g window-status-style "bg=#232136,fg=#6E6A86"
set -g window-status-current-style "bg=#393552,fg=#C4A7E7,bold"
set -g pane-border-style "fg=#44415A"
set -g pane-active-border-style "fg=#C4A7E7"
set -g message-style "bg=#393552,fg=#E0DEF4"
set -g mode-style "bg=#44415A,fg=#E0DEF4"
